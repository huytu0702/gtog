services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: gtog-azurite
    restart: unless-stopped
    ports:
      - "10010:10000"
      - "10011:10001"
      - "10012:10002"
    volumes:
      - azurite-data:/data
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
      - --location
      - /data
      - --debug
      - /data/debug.log
      - --skipApiVersionCheck
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/ | grep -qE '^(400|403)'"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  azurite-data:
    name: gtog-azurite-data
