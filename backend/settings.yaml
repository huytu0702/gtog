### This config file contains required core defaults that must be set, along with a handful of common optional settings.
### For a full list of available settings, see https://microsoft.github.io/graphrag/config/yaml/

### LLM settings ###
## There are a number of settings to tune the threading and token limits for LLM calls - check the docs.

models:
  # Stronger model for graph building (entity extraction, summarization, community reports)
  default_chat_model:
    type: chat
    model_provider: openai
    auth_type: api_key
    api_key: ${OPENAI_API_KEY}
    api_base: ${OPENAI_API_BASE}
    model: gpt-4o-mini
    model_supports_json: true
    concurrent_requests: 5
    async_mode: threaded
    retry_strategy: exponential_backoff
    max_retries: 7
    max_retry_wait: 60.0
    tokens_per_minute: 1000000
    requests_per_minute: 10000

  # Lighter model for querying (local, global, drift, basic, ToG search)
  query_chat_model:
    type: chat
    model_provider: openai
    auth_type: api_key
    api_key: ${OPENAI_API_KEY}
    api_base: ${OPENAI_API_BASE}
    model: gpt-4o-mini
    model_supports_json: true
    concurrent_requests: 2
    async_mode: threaded
    retry_strategy: exponential_backoff
    max_retries: 7
    max_retry_wait: 60.0
    tokens_per_minute: 100000
    requests_per_minute: 600

  default_embedding_model:
    type: embedding
    model_provider: gemini
    auth_type: api_key
    api_key: ${GRAPHRAG_API_KEY}
    model: gemini-embedding-001
    concurrent_requests: 10
    async_mode: threaded
    retry_strategy: exponential_backoff
    max_retries: 7
    max_retry_wait: 60.0
    tokens_per_minute: 100000
    requests_per_minute: 1500

### Input settings ###

input:
  storage:
    type: blob
    connection_string: ${AZURE_STORAGE_CONNECTION_STRING}
    container_name: pipeline-input
    base_dir: "input"
  file_type: text # [csv, text, json]

chunks:
  size: 1200
  overlap: 100
  group_by_columns: [id]

### Output/storage settings ###
## If blob storage is specified in the following four sections,
## connection_string and container_name must be provided

output:
  type: cosmosdb # [file, blob, cosmosdb]
  base_dir: "output"
    
cache:
  type: memory # [file, memory, none]
  base_dir: "cache"

reporting:
  type: blob # [file, blob]
  connection_string: ${AZURE_STORAGE_CONNECTION_STRING}
  container_name: pipeline-logs
  base_dir: "logs"

vector_store:
  default_vector_store:
    type: cosmosdb
    url: ${AZURE_COSMOS_ENDPOINT}
    database_name: ${AZURE_COSMOS_DATABASE_NAME}
    container_name: default
    embeddings_schema:
      entity.description:
        vector_size: 3072
      community.full_content:
        vector_size: 3072
      text_unit.text:
        vector_size: 3072

### Workflow settings ###

embed_text:
  model_id: default_embedding_model
  vector_store_id: default_vector_store

extract_graph:
  model_id: default_chat_model
  prompt: "prompts/extract_graph.txt"
  entity_types: [character, animal, place, object, activity, event]
  max_gleanings: 1

summarize_descriptions:
  model_id: default_chat_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english # [regex_english, syntactic_parser, cfg]
  async_mode: threaded # or asyncio

cluster_graph:
  max_cluster_size: 10
  use_lcc: false

extract_claims:
  enabled: false
  model_id: default_chat_model
  prompt: "prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  model_id: default_chat_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

embed_graph:
  enabled: false # if true, will generate node2vec embeddings for nodes

umap:
  enabled: false # if true, will generate UMAP embeddings for nodes (embed_graph must also be enabled)

snapshots:
  graphml: false
  embeddings: false

### Query settings ###
## The prompt locations are required here, but each search method has a number of optional knobs that can be tuned.
## See the config docs: https://microsoft.github.io/graphrag/config/yaml/#query

local_search:
  chat_model_id: query_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  chat_model_id: query_chat_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  chat_model_id: query_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_search_reduce_prompt.txt"

basic_search:
  chat_model_id: query_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"

# ToG (Think-on-Graph) search configuration
tog_search:
  chat_model_id: query_chat_model
  embedding_model_id: default_embedding_model
  width: 3                          # Beam width for exploration
  depth: 3                          # Maximum exploration depth
  prune_strategy: llm               # Options: llm, semantic, bm25
  num_retain_entity: 5              
  temperature_exploration: 0.4      # LLM temperature for exploration
  temperature_reasoning: 0.0        # LLM temperature for final answer
  max_context_tokens: 8000          # Maximum context tokens
  relation_scoring_prompt: "prompts/tog_relation_scoring_prompt.txt"
  entity_scoring_prompt: "prompts/tog_entity_scoring_prompt.txt"
  reasoning_prompt: "prompts/tog_reasoning_prompt.txt"
