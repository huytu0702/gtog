name: Release

"on":
  workflow_dispatch:
    inputs:
      staging_only:
        description: Stop after staging validation
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '20'
  BUILD_ARTIFACT_NAME: image-metadata
  STAGING_DEPLOY_ARTIFACT_NAME: deploy-staging-log
  PRODUCTION_DEPLOY_ARTIFACT_NAME: deploy-production-log
  SMOKE_STAGING_ARTIFACT_NAME: smoke-staging-report
  SMOKE_PRODUCTION_ARTIFACT_NAME: smoke-production-report
    PHASE3_VALIDATION_ARTIFACT_NAME: edge-origin-validation
    PHASE3_PRODUCTION_VALIDATION_ARTIFACT_NAME: edge-origin-validation-production
  VALIDATE_REPORT_ARTIFACT_NAME: validate-stage-report

jobs:
  validate_release:
    name: Validate release inputs and build readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run release validation
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/validate-stage-report"
          mkdir -p "$report_dir"
          uv sync --dev
          uv run poe check 2>&1 | tee "$report_dir/check.log"
          uv run pytest ./backend/tests/unit ./tests/unit 2>&1 | tee "$report_dir/unit-tests.log"
          (
            cd frontend
            export NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL_STAGING:-https://example.invalid}"
            export NEXT_TELEMETRY_DISABLED=1
            npm ci
            npm run build
          ) 2>&1 | tee "$report_dir/frontend-build.log"

      - name: Upload validate stage report
        uses: actions/upload-artifact@v4
        with:
          name: validate-stage-report
          path: ${{ runner.temp }}/validate-stage-report
          if-no-files-found: error

  build_images:
    name: Build backend and frontend images
    runs-on: ubuntu-latest
    needs:
      - validate_release
    environment: staging
    outputs:
      backend_image: ${{ steps.metadata.outputs.backend_image }}
      worker_image: ${{ steps.metadata.outputs.worker_image }}
      frontend_image_staging: ${{ steps.metadata.outputs.frontend_image_staging }}
      frontend_image_production: ${{ steps.metadata.outputs.frontend_image_production }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login for staging
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"

      - name: Build release images and prepare metadata artifact
        id: metadata
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          BACKEND_IMAGE_REPOSITORY: ${{ vars.BACKEND_IMAGE_REPOSITORY }}
          FRONTEND_IMAGE_REPOSITORY: ${{ vars.FRONTEND_IMAGE_REPOSITORY }}
          NEXT_PUBLIC_API_BASE_URL_STAGING: ${{ vars.NEXT_PUBLIC_API_BASE_URL_STAGING }}
          NEXT_PUBLIC_API_BASE_URL_PRODUCTION: ${{ vars.NEXT_PUBLIC_API_BASE_URL_PRODUCTION }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/image-metadata"
          mkdir -p "$artifact_dir"
          image_tag="${GITHUB_SHA}"
          backend_image="${ACR_LOGIN_SERVER}/${BACKEND_IMAGE_REPOSITORY}:${image_tag}"
          frontend_image_staging="${ACR_LOGIN_SERVER}/${FRONTEND_IMAGE_REPOSITORY}:staging-${image_tag}"
          frontend_image_production="${ACR_LOGIN_SERVER}/${FRONTEND_IMAGE_REPOSITORY}:production-${image_tag}"
          docker build -f backend/Dockerfile -t "$backend_image" .
          docker build --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL_STAGING" -f frontend/Dockerfile -t "$frontend_image_staging" frontend
          docker build --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL_PRODUCTION" -f frontend/Dockerfile -t "$frontend_image_production" frontend
          docker push "$backend_image"
          docker push "$frontend_image_staging"
          docker push "$frontend_image_production"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'backend_image=%s\n' "$backend_image"
            printf 'worker_image=%s\n' "$backend_image"
            printf 'frontend_image_staging=%s\n' "$frontend_image_staging"
            printf 'frontend_image_production=%s\n' "$frontend_image_production"
          } > "$artifact_dir/metadata.txt"
          {
            printf 'backend_image=%s\n' "$backend_image"
            printf 'worker_image=%s\n' "$backend_image"
            printf 'frontend_image_staging=%s\n' "$frontend_image_staging"
            printf 'frontend_image_production=%s\n' "$frontend_image_production"
          } >> "$GITHUB_OUTPUT"

      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: image-metadata
          path: ${{ runner.temp }}/image-metadata
          if-no-files-found: error

  deploy_staging:
    name: Deploy staging environment
    runs-on: ubuntu-latest
    needs:
      - build_images
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image metadata
        uses: actions/download-artifact@v4
        with:
          name: image-metadata
          path: ${{ runner.temp }}/image-metadata

      - name: Azure login for staging
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run staging deployment script
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          FRONTEND_APP_NAME: ${{ vars.FRONTEND_APP_NAME }}
          API_APP_NAME: ${{ vars.API_APP_NAME }}
          WORKER_APP_NAME: ${{ vars.WORKER_APP_NAME }}
          TUNNEL_APP_NAME: ${{ vars.TUNNEL_APP_NAME }}
          APP_PUBLIC_HOSTNAME: ${{ vars.APP_PUBLIC_HOSTNAME }}
          API_PUBLIC_HOSTNAME: ${{ vars.API_PUBLIC_HOSTNAME }}
          FRONTEND_IMAGE: ${{ needs.build_images.outputs.frontend_image_staging }}
          API_IMAGE: ${{ needs.build_images.outputs.backend_image }}
          WORKER_IMAGE: ${{ needs.build_images.outputs.worker_image }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          EDGE_ORIGIN_SECRET: ${{ secrets.EDGE_ORIGIN_SECRET }}
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
            CREATE_APPS: "true"
          run: |
            set -euo pipefail
            artifact_dir="$RUNNER_TEMP/deploy-staging-log"
          mkdir -p "$artifact_dir"
          ROLLOUT_MODE=reconcile \
          ROLLOUT_STATE_FILE="$artifact_dir/rollout-state.json" \
          bash ./scripts/provision-aca-private-origin.sh > "$artifact_dir/deploy-staging.log" 2>&1

      - name: Upload staging deployment log
        uses: actions/upload-artifact@v4
        with:
          name: deploy-staging-log
          path: ${{ runner.temp }}/deploy-staging-log
          if-no-files-found: error

  smoke_staging:
    name: Run staging smoke and security gates
    runs-on: ubuntu-latest
    needs:
      - deploy_staging
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download staging deployment log
        uses: actions/download-artifact@v4
        with:
          name: deploy-staging-log
          path: ${{ runner.temp }}/deploy-staging-log

      - name: Azure login for staging
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run staging smoke gates
        env:
          APP_BASE_URL: https://${{ vars.APP_PUBLIC_HOSTNAME }}
          APP_PUBLIC_HOSTNAME: ${{ vars.APP_PUBLIC_HOSTNAME }}
          API_BASE_URL: https://${{ vars.API_PUBLIC_HOSTNAME }}
          API_PUBLIC_HOSTNAME: ${{ vars.API_PUBLIC_HOSTNAME }}
          AUTH_BEARER_TOKEN: ${{ secrets.AUTH_BEARER_TOKEN }}
            PROBE_ORIGIN_URLS: ${{ vars.PROBE_ORIGIN_URLS }}
            RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
            SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            API_APP_NAME: ${{ vars.API_APP_NAME }}
            WORKER_APP_NAME: ${{ vars.WORKER_APP_NAME }}
            TUNNEL_APP_NAME: ${{ vars.TUNNEL_APP_NAME }}
            SMOKE_ARTIFACT_NAME: smoke-staging-report
            PHASE3_VALIDATION_ARTIFACT_NAME: edge-origin-validation
            SMOKE_PHASE_LABEL: staging
            ROLLOUT_STATE_FILE: ${{ runner.temp }}/deploy-staging-log/rollout-state.json
            EVIDENCE_DIR: ${{ runner.temp }}/smoke-staging-report
        run: |
          set -euo pipefail
          chmod +x ./scripts/smoke-release-gates.sh
          bash ./scripts/smoke-release-gates.sh

      - name: Upload staging smoke report
        uses: actions/upload-artifact@v4
        with:
          name: smoke-staging-report
          path: ${{ runner.temp }}/smoke-staging-report
          if-no-files-found: error

      - name: Upload staging phase 3 evidence
        uses: actions/upload-artifact@v4
        with:
            name: edge-origin-validation
            path: ${{ runner.temp }}/smoke-staging-report
            if-no-files-found: error

  await_prod_approval:
    name: Await production approval
    runs-on: ubuntu-latest
    needs:
      - smoke_staging
    if: ${{ !inputs.staging_only }}
    environment: production-approval
    steps:
      - name: Approval checkpoint
        run: echo "Production approval granted"

  deploy_production:
    name: Deploy production environment
    runs-on: ubuntu-latest
    needs:
      - await_prod_approval
    if: ${{ !inputs.staging_only }}
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image metadata
        uses: actions/download-artifact@v4
        with:
          name: image-metadata
          path: ${{ runner.temp }}/image-metadata

      - name: Azure login for production
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run production deployment script
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          FRONTEND_APP_NAME: ${{ vars.FRONTEND_APP_NAME }}
          API_APP_NAME: ${{ vars.API_APP_NAME }}
          WORKER_APP_NAME: ${{ vars.WORKER_APP_NAME }}
          TUNNEL_APP_NAME: ${{ vars.TUNNEL_APP_NAME }}
          APP_PUBLIC_HOSTNAME: ${{ vars.APP_PUBLIC_HOSTNAME }}
          API_PUBLIC_HOSTNAME: ${{ vars.API_PUBLIC_HOSTNAME }}
          FRONTEND_IMAGE: ${{ needs.build_images.outputs.frontend_image_production }}
          API_IMAGE: ${{ needs.build_images.outputs.backend_image }}
          WORKER_IMAGE: ${{ needs.build_images.outputs.worker_image }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          EDGE_ORIGIN_SECRET: ${{ secrets.EDGE_ORIGIN_SECRET }}
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
            CREATE_APPS: "true"
          run: |
            set -euo pipefail
            artifact_dir="$RUNNER_TEMP/deploy-production-log"
          mkdir -p "$artifact_dir"
          ROLLOUT_MODE=reconcile \
          ROLLOUT_STATE_FILE="$artifact_dir/rollout-state.json" \
          bash ./scripts/provision-aca-private-origin.sh > "$artifact_dir/deploy-production.log" 2>&1

      - name: Upload production deployment log
        uses: actions/upload-artifact@v4
        with:
          name: deploy-production-log
          path: ${{ runner.temp }}/deploy-production-log
          if-no-files-found: error

  smoke_production:
    name: Run production smoke and security gates
    runs-on: ubuntu-latest
    needs:
      - deploy_production
    if: ${{ !inputs.staging_only }}
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download production deployment log
        uses: actions/download-artifact@v4
        with:
          name: deploy-production-log
          path: ${{ runner.temp }}/deploy-production-log

      - name: Azure login for production
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run production smoke gates
        env:
          APP_BASE_URL: https://${{ vars.APP_PUBLIC_HOSTNAME }}
          APP_PUBLIC_HOSTNAME: ${{ vars.APP_PUBLIC_HOSTNAME }}
          API_BASE_URL: https://${{ vars.API_PUBLIC_HOSTNAME }}
          API_PUBLIC_HOSTNAME: ${{ vars.API_PUBLIC_HOSTNAME }}
          AUTH_BEARER_TOKEN: ${{ secrets.AUTH_BEARER_TOKEN }}
            PROBE_ORIGIN_URLS: ${{ vars.PROBE_ORIGIN_URLS }}
            RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
            SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            API_APP_NAME: ${{ vars.API_APP_NAME }}
            WORKER_APP_NAME: ${{ vars.WORKER_APP_NAME }}
            TUNNEL_APP_NAME: ${{ vars.TUNNEL_APP_NAME }}
            SMOKE_ARTIFACT_NAME: smoke-production-report
            PHASE3_VALIDATION_ARTIFACT_NAME: edge-origin-validation-production
            SMOKE_PHASE_LABEL: production
            ROLLOUT_STATE_FILE: ${{ runner.temp }}/deploy-production-log/rollout-state.json
            EVIDENCE_DIR: ${{ runner.temp }}/smoke-production-report
        run: |
          set -euo pipefail
          chmod +x ./scripts/smoke-release-gates.sh
          bash ./scripts/smoke-release-gates.sh

      - name: Upload production smoke report
        uses: actions/upload-artifact@v4
        with:
          name: smoke-production-report
          path: ${{ runner.temp }}/smoke-production-report
          if-no-files-found: error

      - name: Upload production phase 3 evidence
        uses: actions/upload-artifact@v4
        with:
            name: edge-origin-validation-production
            path: ${{ runner.temp }}/smoke-production-report
            if-no-files-found: error
