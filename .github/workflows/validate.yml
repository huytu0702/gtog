name: Validate

"on":
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality_checks:
    name: Quality checks and builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --dev

      - name: Run quality checks and unit tests
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/validate-stage-report"
          mkdir -p "$report_dir"
          uv run poe check 2>&1 | tee "$report_dir/check.log"
          uv run pytest ./backend/tests/unit ./tests/unit 2>&1 | tee "$report_dir/unit-tests.log"

      - name: Validate frontend production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://example.invalid
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Upload validate stage report
        uses: actions/upload-artifact@v4
        with:
          name: validate-stage-report
          path: ${{ runner.temp }}/validate-stage-report
          if-no-files-found: error
